name: Actualizar pronosticos NFL

# Solo se ejecuta cuando tú lo pides: con el botón "Actualizar ahora" de la app
# o con "Run workflow" en la pestaña Actions. No hay horarios automáticos.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash run.sh
      - name: Guardar resultados
        run: |
          git config user.name "actualizador-nfl"
          git config user.email "actions@github.com"
          git add state docs
          git commit -m "Actualizacion manual $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
